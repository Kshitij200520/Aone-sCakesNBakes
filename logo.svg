<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="450" height="110">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D49B" />
      <stop offset="50%" stop-color="#E5B067" />
      <stop offset="100%" stop-color="#B8823B" />
    </linearGradient>
  </defs>

  <!-- Cupcake / Crown Emblem -->
  <g transform="translate(10, 12)">
    <circle cx="42" cy="42" r="40" fill="#1E120B" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Crown / Whip detail -->
    <path d="M42 18 C47 25 54 27 54 34 C54 42 30 42 30 34 C30 27 37 25 42 18 Z" fill="url(#goldGrad)"/>
    <!-- Cake Base -->
    <path d="M26 44 L58 44 L53 64 L31 64 Z" fill="#F5D49B"/>
    <path d="M28 44 L31 64 M37 44 L38 64 M47 44 L46 64 M54 44 L51 64" stroke="#1E120B" stroke-width="1.5" opacity="0.6"/>
    <!-- Star accent -->
    <path d="M42 12 L43.5 15 L47 15.5 L44.5 18 L45 21.5 L42 19.5 L39 21.5 L39.5 18 L37 15.5 L40.5 15 Z" fill="#FFF"/>
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="105" y="48" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" fill="url(#goldGrad)" letter-spacing="0.5">
    Aone's Cakes N Bakes
  </text>
  
  <!-- Subtitle Line -->
  <line x1="106" y1="62" x2="430" y2="62" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Tagline -->
  <text x="106" y="80" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#C4B5A5" letter-spacing="3">
    SINCE 1952 • 100% EGGLESS BAKERY
  </text>
</svg>
